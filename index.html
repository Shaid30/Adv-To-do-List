<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Todo List</h1>
    <form id="todoForm">
        <input type="text" id="addTask" placeholder="Enter your task">

        <button type="submit">addTask</button>
    </form>
    <input type="text" id="searchInput" placeholder="Search task.....">
    <div>
        <button id="allBtn">All</button>
        <button id="completedBtn">Completed</button>
        <button id="pendingBtn">Pending</button>
    </div>
    <div>
        <p> Total:  <span id="totalCount"> 0</span></p>
        <p> Completed:  <span id= "completedCount"> 0</span></p>
        <p> Pending:  <span id="pendingCount"> 0</span></p>
    </div>

    <ul id="todoList"></ul>

    
    <script src="script.js"></script>
</body>
</html>
